spring.application.name=project-monitoring-system
server.port=${PORT:8080}

# H2 Database
spring.datasource.url=jdbc:h2:file:./data/project_monitoring_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 100MB Upload Limits for MP4 Screen Recordings, ZIP packages & Docs
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# JWT
jwt.secret=9a67c77f0a91a92e4e1a0b3f8a4c8b2d1e5f7a9c3b5d7e9f1a3c5e7f9a1b3d5e
jwt.expiration=86400000

# File Storage
file.upload-dir=./uploads

# CORS
cors.allowed-origins=*