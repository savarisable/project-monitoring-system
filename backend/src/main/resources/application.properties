# ============================================================================
# PROJECT MONITORING SYSTEM - APPLICATION CONFIGURATION
# ============================================================================

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# Database Configuration
# Defaults to file-based persistent H2 with MySQL mode (works out of the box with zero external dependencies)
# Can be overridden with MySQL via environment variables DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/project_monitoring_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# H2 Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
app.file-storage.upload-dir=./uploads

# JWT Security Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.academic.projectmonitoring=INFO
logging.level.org.springframework.security=WARN
